# SmartATS Database Configuration
# Default: Local MySQL Server
db.type=mysql
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/smart_ats_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root

# Fallback Embedded Mode (Used automatically if MySQL is unreachable or if db.type=embedded)
embedded.driver=org.h2.Driver
embedded.url=jdbc:h2:mem:smart_ats_db;DB_CLOSE_DELAY=-1;MODE=MySQL
embedded.user=sa
embedded.password=

